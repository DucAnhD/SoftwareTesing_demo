<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Checklist</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell">
<section id="login-view" class="panel" hidden><div class="eyebrow">WELCOME BACK</div><h1>Sign in</h1><p class="muted">Sign in to manage your personal checklist.</p><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p id="login-error" class="error" role="alert"></p></section>
<section id="app-view" class="panel" hidden><header><div><div class="eyebrow">YOUR WORKSPACE</div><h1>My checklist</h1><p id="session-info" class="muted"></p></div><button id="logout" class="secondary" type="button">Log out</button></header><form id="add-form" class="add-row"><input id="new-item" aria-label="New checklist item" maxlength="200" placeholder="What needs to be done?" required><button type="submit">Add item</button></form><p id="app-error" class="error" role="alert"></p><div class="list-header"><span>Tasks</span><span id="count"></span></div><ul id="items" aria-label="Checklist items"></ul><p id="empty" class="muted empty">No items yet. Add your first task above.</p></section>
</main><script src="/app.js" defer></script></body></html>
